spring:
  datasource:
    url: jdbc:postgresql://${MEDXPRESS_DB_HOST:prod-db-host}:5432/medxpress_db
    username: ${MEDXPRESS_DB_USER}
    password: ${MEDXPRESS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  liquibase:
    enabled: false
    change-log: classpath:/db/changelog/changelog-prod.yaml

server:
  port: 8080

logging:
  level:
    root: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
